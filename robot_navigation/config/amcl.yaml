amcl:
  ros__parameters:

    use_sim_time: true

    # Frames
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"

    # Topics
    scan_topic: scan
    map_topic: map

    # AMCL motion model
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # Particle filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # Odometry noise
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.15
    alpha5: 0.1

    # Laser model (lidar max range = 10.0 m)
    laser_model_type: "likelihood_field"
    max_beams: 100
    laser_min_range: 0.12
    laser_max_range: 10.0
    laser_likelihood_max_dist: 2.0

    # Sensor model weights
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2

    # Update settings
    update_min_d: 0.25
    update_min_a: 0.1

    # TF
    tf_broadcast: true
    transform_tolerance: 0.1

    # Initial pose (same point where SLAM was started)
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0

    # Recovery
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    save_pose_rate: 0.5
    do_beamskip: false
    first_map_only: false
